<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="avatarClip">
      <circle cx="110" cy="110" r="82"/>
    </clipPath>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2CC985"/>
      <stop offset="25%" stop-color="#0078D6"/>
      <stop offset="50%" stop-color="#FF6F00"/>
      <stop offset="75%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#2CC985"/>
    </linearGradient>
  </defs>

  <!-- Rotating gradient ring -->
  <g>
    <circle cx="110" cy="110" r="102" fill="none" stroke="url(#ringGradient)"
            stroke-width="6" stroke-linecap="round" stroke-dasharray="480 160">
      <animateTransform attributeName="transform" type="rotate"
                         from="0 110 110" to="360 110 110"
                         dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Static avatar photo: ABSOLUTE raw.githubusercontent.com URL (relative paths do not
       resolve inside an SVG rendered via <img> on GitHub) -->
  <image xlink:href="https://raw.githubusercontent.com/diloshan-dev/diloshan-dev/main/DILSHAN%20AI%20GEMINI.png"
         x="28" y="28" width="164" height="164"
         clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Subtle inner ring for depth -->
  <circle cx="110" cy="110" r="82" fill="none" stroke="#0d1117" stroke-width="3"/>
</svg>
